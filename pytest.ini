[pytest]
# ── pytest-asyncio configuration ──────────────────────────────────────────────
#
# asyncio_mode = auto
#   Every async test function and async fixture is treated as an asyncio
#   coroutine automatically — no @pytest.mark.asyncio decorator needed.
#
# asyncio_default_fixture_loop_scope = session
#   All async fixtures (including session-scoped ones like `started_services`)
#   share ONE event loop for the entire test session.
#
# Why this is required for AlphaMesh
# ───────────────────────────────────
# ServiceManager.startup() → Neo4jAdapter.connect() creates an AsyncDriver
# whose connection pool sockets bind their asyncio.StreamReader waiters to the
# event loop that is running at creation time.
#
# Without session scope, pytest-asyncio creates a FRESH event loop per test
# function (the default).  Session-scoped async fixtures (started_services)
# run on loop L1; each test then runs on loop L2, L3, … — so every Neo4j
# operation raises:
#     RuntimeError: Task got Future attached to a different loop
#
# Setting asyncio_default_fixture_loop_scope = session ensures that
# started_services and every test coroutine all run on the SAME loop, so the
# driver's connection pool is always valid.
#
# Compatibility: pytest-asyncio >= 0.23 (required).
# If you are on an older version, upgrade:  pip install "pytest-asyncio>=0.23"
#
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session